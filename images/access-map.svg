<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" width="100%" role="img" aria-labelledby="mapTitle mapDesc">
<title id="mapTitle">常在寺 駐車場と山門への案内図</title>
<desc id="mapDesc">北東に9台、西側に3台の参拝者駐車場があります。一方通行は西側の道（北から南）と国道256号（東から西）の2本です。北東に停めた場合は北側の道を、西側に停めた場合は西側の道を歩き、国道256号を東へ進んで南側の山門から入ります。</desc>
<style>
.t{font-family:"游明朝","Yu Mincho","ヒラギノ明朝 ProN","Hiragino Mincho ProN",serif;font-size:17px;font-weight:500;fill:#2c2418}
.s{font-family:"游明朝","Yu Mincho","ヒラギノ明朝 ProN","Hiragino Mincho ProN",serif;font-size:15px;font-weight:400;fill:#6b5f4d}
</style>
