<text class="t" x="513" y="189" text-anchor="middle" dominant-baseline="central" fill="#7a6234">駐車場</text>
<text class="s" x="513" y="212" text-anchor="middle" dominant-baseline="central" fill="#7a6234">9台</text>

<rect x="205" y="215" width="132" height="58" rx="14" fill="#faf4e9" stroke="#c4a76b" stroke-width="0.8"/>
<text class="t" x="271" y="236" text-anchor="middle" dominant-baseline="central" fill="#7a6234">西駐車場</text>
<text class="s" x="271" y="257" text-anchor="middle" dominant-baseline="central" fill="#7a6234">3台</text>

<rect x="372" y="310" width="186" height="72" rx="14" fill="#efe8dc" stroke="#a99277" stroke-width="0.5"/>
<text class="t" x="465" y="346" text-anchor="middle" dominant-baseline="central">本堂</text>

